plugins { id 'com.android.application' }

// Public OAuth client ID; supply it locally without committing machine configuration.
def strideLocalProperties = new Properties()
def strideLocalPropertiesFile = rootProject.file('local.properties')
if (strideLocalPropertiesFile.exists()) {
    strideLocalPropertiesFile.withInputStream { strideLocalProperties.load(it) }
}
def strideGoogleWebClientId = providers.gradleProperty('stride.googleWebClientId')
        .orElse(strideLocalProperties.getProperty('stride.googleWebClientId', '')).get().trim()
if (!strideGoogleWebClientId.isEmpty()
        && !(strideGoogleWebClientId ==~ /[A-Za-z0-9_-]+\.apps\.googleusercontent\.com/)) {
    throw new GradleException('stride.googleWebClientId must be a Google Web OAuth client ID')
}

android {
    namespace 'com.stride.android'
    compileSdk 35

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId 'com.stride.android'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'google_web_client_id', strideGoogleWebClientId
    }
}


dependencies {
    // Align Kotlin runtimes pulled in transitively by AndroidX.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
